[package]
name = "stickshift-ecs"
description = "hecs wrapper and shared engine components for Stick Shift Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
hecs.workspace = true
stickshift-math.workspace = true

[features]
# `stickshift_ecs::dynamic`: components registered at run time, for the C API.
# Off by default, so Rust games do not compile its 256 slot types.
dynamic = []

[dev-dependencies]
# Turns `dynamic` on for this crate's own tests, so `cargo test --workspace` runs
# them without any other crate enabling the feature.
stickshift-ecs = { path = ".", features = ["dynamic"] }
