[package]
name = "stickshift-core"
description = "Application lifecycle and platform layer for Stick Shift Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# The winit window and the AppKit Graphics menu: the Rust runner (`run`,
# `run_with_backend`, `run_with_config`). On by default, so a Rust game gets its
# window with no feature to name. A host that owns its own view and display link
# (an iOS app, say) builds this crate without it and drives the platform-free
# `Session` instead, so neither winit nor AppKit reaches it.
default = ["windowed"]
windowed = ["dep:winit", "dep:objc2-app-kit"]

[dependencies]
stickshift-math.workspace = true
# The audio layer. `stickshift-audio` is a leaf that owns the `kira`/`cpal`
# dependency, and `stickshift-core` is its only engine-side consumer: the loop owns one
# `Audio` and hands it to the game through `EngineCtx`. No other engine crate —
# and nothing below the render seam — gains an audio dependency.
stickshift-audio.workspace = true
stickshift-ecs.workspace = true
stickshift-camera.workspace = true
stickshift-scene.workspace = true
stickshift-render-api.workspace = true
stickshift-perf.workspace = true
# Recording (`Recording`): the movie writer. AVFoundation on Apple targets, iOS
# as well as macOS; no windowing and no Metal.
stickshift-video.workspace = true
winit = { workspace = true, optional = true }

# Graphics-settings persistence (`NSUserDefaults`), on every Apple target:
# Foundation only, so it builds for iOS as well as macOS.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true

# A diagnostics capture's memory, machine and local time (see `diagnostics`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The built-in Graphics menu (`NSMenu`), for the windowed runner only. Same objc2
# versions winit 0.30 already builds, so no new crates enter the build; AppKit's
# Metal/QuartzCore features stay off, so `metal` stays out of this crate's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, optional = true }
