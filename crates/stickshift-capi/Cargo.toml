[package]
name = "stickshift-capi"
description = "C API for Stick Shift Engine: libstickshift (static and dynamic) and the generated stickshift.h."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
# Built as `libstickshift.a` / `libstickshift.dylib` for C and Swift hosts, and as an rlib
# so the Rust integration tests can call the `extern "C"` functions directly.
name = "stickshift"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embed precompiled Metal shaders instead of compiling them at runtime (needs full
# Xcode to build; see stickshift-render's feature of the same name). Release builds
# of libstickshift turn it on.
precompiled-shaders = ["stickshift-render/precompiled-shaders"]

[dependencies]
stickshift-math.workspace = true
stickshift-render-api.workspace = true
# stickshift-assets' default `ecs` feature (its hecs glue) stays off.
# A path dependency rather than `workspace = true` so `default-features = false`
# takes effect.
stickshift-assets = { path = "../stickshift-assets", default-features = false }
# The engine loop the C API's engine object runs (`Loop`, `drive_frame`, `Session`),
# without its `windowed` feature, so neither winit nor the AppKit menu reaches
# libstickshift. Also a path dependency, for `default-features = false`.
stickshift-core = { path = "../stickshift-core", default-features = false }
# The engine's world, with components registered at run time (`dynamic`) for C
# games, and the scene its streaming calls run.
stickshift-ecs = { workspace = true, features = ["dynamic"] }
stickshift-scene.workspace = true

[dev-dependencies]
# Only to check that the projection helper matches the camera's.
stickshift-camera.workspace = true

# The Metal pixel test renders the same scene through the Rust API to compare.
[target.'cfg(target_os = "macos")'.dev-dependencies]
stickshift-render.workspace = true

# The Metal backend. Elsewhere only the null backend exists, which keeps the
# crate (and its tests) building on any platform.
[target.'cfg(target_os = "macos")'.dependencies]
stickshift-render.workspace = true
