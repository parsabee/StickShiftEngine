[package]
name = "stickshift-render"
description = "Raw-Metal implementation of the stickshift-render-api seam for Stick Shift Engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []

# ASTC compressed base-color textures on device. OFF by default: macOS
# on the Command Line Tools has no ASTC transcoder, so RGBA8 is the accepted
# fallback and `create_texture` uploads uncompressed. A device/mobile build turns
# this on to upload pre-compressed ASTC blocks (`texture_pixel_format` flips to
# `ASTC_4x4_LDR`). Structured behind this feature so the desktop path is unchanged.
astc-textures = []

# Precompiled shaders. When ON, build.rs compiles shaders/rasterization.metal to a
# .metallib ahead of time, the crate embeds it, and the backend loads it with
# new_library_with_data, so no shader is compiled at runtime. This REQUIRES the
# Metal toolchain (full Xcode; see scripts/preflight.sh --ios). OFF by default so a
# development build needs only the Command Line Tools (shaders then compile at
# runtime via new_library_with_source). Release builds (the Homebrew tarball and
# libstickshift) turn it on, and CI tests both ways.
precompiled-shaders = []

# The `objc` 0.2 `msg_send!`/`sel_impl!` macros emit a `cfg(cargo-clippy)` check
# that trips `unexpected_cfgs` on our call sites (the cfg is defined by clippy,
# not us). Allow that one unknown cfg value so `-D warnings` stays clean; it is a
# third-party-macro artifact, not our code.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_clippy)'] }

[dependencies]
stickshift-math.workspace = true
stickshift-render-api.workspace = true
metal.workspace = true
block.workspace = true
objc.workspace = true
cocoa.workspace = true
core-graphics-types.workspace = true
raw-window-handle.workspace = true

[dev-dependencies]
# Tests build a real Camera to produce the view-projection they push through the
# seam (`set_view_projection`). The backend itself owns no camera and never
# depends on stickshift-camera.
stickshift-camera.workspace = true
