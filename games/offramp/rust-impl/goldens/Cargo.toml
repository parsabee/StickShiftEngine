[package]
name = "offramp-goldens"
description = "Writes the golden fixtures Offramp (games/offramp) is tested against, from the playable demo's own modules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# A tool, not a library: nothing to test or document. Its output is checked by
# comparing it with the committed fixtures (see the README).
[[bin]]
name = "offramp-goldens"
path = "src/main.rs"
test = false
doc = false

[dependencies]
stickshift-assets.workspace = true
stickshift-camera.workspace = true
stickshift-core.workspace = true
stickshift-ecs.workspace = true
stickshift-math.workspace = true
stickshift-render-api.workspace = true
stickshift-scene.workspace = true
