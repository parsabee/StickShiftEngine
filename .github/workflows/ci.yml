name: CI

# The macOS oracle: every push/PR must build, test, lint clean, and boot the headless smoke
# oracle. Red blocks merge. See docs/INTEGRATION.md §1.
#
# Also runs on release tags (`v*`, e.g. `v0.1.0-alpha.1`) so every tagged release has its own
# green run, and on demand from the Actions tab / `gh workflow run ci.yml --ref main`.
# Pull requests are checked whatever their base, so a PR stacked on another PR's branch gets
# its own run instead of waiting until it is retargeted to main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: build / test / clippy / smoke (macOS)
    runs-on: macos-latest
    # The GPU tests skip without a Metal device; here a missing device fails them
    # instead, so a runner that lost its GPU cannot pass the render suite unrun.
    env:
      STICKSHIFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      # Install exactly the toolchain pinned in rust-toolchain.toml (channel + components), so CI
      # builds with the same rustc as contributors. Argument-less `rustup toolchain install` reads
      # the toolchain file (rustup >= 1.28); the version check fails the job if the pin is ignored.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc --version
          rustc --version | grep -q " $pinned " || { echo "rustc is not the pinned $pinned"; exit 1; }

      # Fail fast on unformatted code (rustfmt defaults); fix locally with `cargo fmt --all`.
      - name: Format check (rustfmt)
        run: cargo fmt --all -- --check

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Verify the project's declared toolchain dependencies are present before building.
      # Default tier only; the iOS/.metallib tier (`--ios`) is not required yet.
      - name: Toolchain preflight
        run: ./scripts/preflight.sh

      - name: Build workspace
        run: cargo build --workspace

      # Render-seam dependency firewall (docs/ARCHITECTURE.md §2). stickshift-render-api defines the
      # render contract; it must never depend on `metal`. Fail if `metal` appears anywhere in
      # this crate's normal dependency tree. `grep -q` exits 0 on a match, so negation makes the
      # step fail when metal is present and pass when it is absent.
      - name: Render seam has no metal dependency
        run: "! cargo tree -p stickshift-render-api -e normal | grep -qi metal"

      # stickshift-core without its default `windowed` feature is what a host that owns its own
      # view links (the C API): it must build for macOS and iOS with no winit and no AppKit.
      - name: Core builds without a platform (macOS and iOS)
        run: |
          rustup target add aarch64-apple-ios
          cargo build -p stickshift-core --no-default-features
          cargo build -p stickshift-core --no-default-features --target aarch64-apple-ios

      - name: Core without a platform has no winit or AppKit dependency
        run: "! cargo tree -p stickshift-core --no-default-features -e normal | grep -qiE 'winit|objc2-app-kit'"

      # The workspace doc build turns `windowed` back on (offramp needs it), so document
      # the no-platform configuration on its own. Its links to the winit runner are allowed to
      # dangle there (lib.rs says why); everything else must resolve.
      - name: Core docs build without a platform
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -A rustdoc::redundant_explicit_links"
        run: cargo doc -p stickshift-core --no-deps --no-default-features

      # De-brand guard. No prototype identifiers may appear in
      # shipped engine code; provenance lives in docs/ only. Scans crates/ and games/; grep exits
      # 0 on a match, so the negation fails the step when an identifier is found.
      - name: No prototype identifiers in shipped code
        run: "! grep -rniI projectrigor crates games"

      # Rename guard: the project's previous name must not appear anywhere in the repository.
      - name: No pre-rename names
        run: ./scripts/check-renamed.sh

      - name: Test workspace
        run: cargo test --workspace

      # The C library runs the engine for a host that owns the window: it links stickshift-core
      # without its `windowed` feature (so audio and the ECS come along), and no windowing,
      # AppKit-menu or physics crate may reach it. `grep -q` exits 0 on a match, so the
      # negation fails the step when one does.
      - name: C library has no windowing, AppKit-menu or physics dependency
        run: "! cargo tree -p stickshift-capi -e normal | grep -qiE 'winit|objc2-app-kit|rapier'"

      # stickshift.h is generated by cbindgen and committed; fail if it no longer matches the
      # Rust sources. The pinned cbindgen is cached in ~/.cargo/bin by rust-cache.
      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.0 --locked

      - name: C header is up to date
        run: ./scripts/gen-header.sh --check

      # Compile the C smoke test and the C sample against stickshift.h + libstickshift.a with clang
      # (-Werror -pedantic) and run them on the runner's Metal device.
      - name: C API smoke test and sample (Metal)
        run: ./scripts/test-c-api.sh

      # Build the Swift package (bindings/swift/StickShift) over libstickshift and run its
      # tests: the null backend everywhere, and Metal on the runner's device.
      - name: Swift package tests
        run: ./scripts/test-swift.sh

      # Offramp (games/offramp): the playable demo as a Swift game on the engine,
      # through the package. Its tests check it against the Rust demo's golden
      # values, the null backend everywhere and Metal on the runner's device.
      - name: Offramp tests
        run: ./scripts/test-offramp.sh

      # Run Offramp and the Rust demo side by side: the --smoke output and exit
      # status, the smoke, autopilot and long traces byte for byte, and all 80
      # recorder frames pixel for pixel on the runner's GPU.
      - name: Offramp parity with the Rust demo
        run: ./scripts/offramp-parity.sh

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Docs must generate with no broken/private intra-doc links (rustdoc). Cosmetic
      # redundant-explicit-link nags are allowed. Keeps `cargo doc` output clean.
      - name: Rustdoc (deny broken links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -A rustdoc::redundant_explicit_links"
        run: cargo doc --workspace --no-deps

      # Headless smoke oracle: runs the demo's game loop for 120 frames against the CPU-only
      # NullRenderer, so it needs no GPU. Metal API Validation stays on so any Metal use on this
      # path is validated.
      - name: Smoke oracle (Metal API Validation on)
        env:
          METAL_DEVICE_WRAPPER_TYPE: "1"
        run: cargo run -p offramp -- --smoke

  # The same renderer with its shaders compiled ahead of time and embedded (the
  # `precompiled-shaders` feature, what release builds ship): it must build with the Metal
  # toolchain, load the .metallib, and pass the GPU tests (pixel hashes included) unchanged.
  precompiled-shaders:
    name: precompiled shaders (macOS)
    runs-on: macos-latest
    env:
      STICKSHIFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --no-self-update
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustc --version
          rustc --version | grep -q " $pinned " || { echo "rustc is not the pinned $pinned"; exit 1; }

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The Metal shader compiler comes with full Xcode; recent Xcode versions download it as a
      # separate component on first use.
      - name: Metal toolchain
        run: |
          xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
          ./scripts/preflight.sh --ios || true

      - name: Test the renderer, C API and demo with precompiled shaders
        run: cargo test -p stickshift-render -p stickshift-capi -p offramp --features stickshift-render/precompiled-shaders

      # The release library must carry the compiled .metallib, not the shader source: the
      # source's header comment is in a runtime-compiling build and absent from this one.
      - name: The C library embeds compiled shaders
        run: |
          cargo build --release -p stickshift-capi --features precompiled-shaders
          ! grep -aq "Rasterization Shader - Phong Lighting Model" target/release/libstickshift.a

      - name: C API smoke test and sample (precompiled shaders)
        env:
          STICKSHIFT_FEATURES: precompiled-shaders
        run: ./scripts/test-c-api.sh
