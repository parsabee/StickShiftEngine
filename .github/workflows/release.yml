name: Release

# Create the GitHub release for a version tag. The engine is used from source (a Cargo git
# dependency pinned to the tag), so a release carries no build artefacts: CI has already
# built and tested the tagged commit.
#
# Runs on every `v*` tag push, or by hand for an existing tag:
#   gh workflow run release.yml -f tag=v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The tag must name the workspace version, or the release would lie about its contents.
      - name: Resolve version
        id: version
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "tag '$TAG' does not start with v"; exit 1 ;;
          esac
          version="${TAG#v}"
          ws=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "$version" = "$ws" ] || { echo "tag $TAG does not match workspace version $ws"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            # SemVer pre-releases (anything with a `-`, e.g. -alpha.2) are marked as such.
            pre=()
            case "$VERSION" in *-*) pre=(--prerelease) ;; esac
            gh release create "$TAG" "${pre[@]}" --verify-tag --title "$TAG" \
              --notes "Stick Shift Engine $TAG. See CHANGELOG.md for what changed."
          fi
